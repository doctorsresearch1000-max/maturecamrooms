name: Deploy to Cloudflare Pages

# Authoritative build + deploy path. Cloudflare Pages Git builds do not receive
# GitHub secrets; dashboard CRAK vars must be scoped to Preview too if CF Git
# preview builds stay enabled. See docs/cloudflare-pages-crak-build.md.

on:
  push:
    branches:
      - main
      - "cursor/**"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write

    env:
      NEXT_PUBLIC_SITE_NAME: MatureCamRooms
      NEXT_PUBLIC_SITE_URL: https://maturecamrooms.com
      CRAK_API_KEY: ${{ secrets.CRAK_API_KEY }}
      CRAK_TOKEN: ${{ secrets.CRAK_TOKEN }}
      CRAK_CAM_API_BASE: ${{ secrets.CRAK_CAM_API_BASE }}
      CRAK_BRANDS: ${{ secrets.CRAK_BRANDS }}
      CRAK_LANDING_ID: ${{ secrets.CRAK_LANDING_ID }}
      CRAKREVENUE_API_KEY: ${{ secrets.CRAKREVENUE_API_KEY }}
      CRAKREVENUE_API_TOKEN: ${{ secrets.CRAKREVENUE_API_TOKEN }}
      CRACKREVENUE_TOKEN: ${{ secrets.CRACKREVENUE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CRAK_API_KEY}" ] && [ -z "${CRAKREVENUE_API_KEY}" ]; then
            echo "::error::CRAK_API_KEY (or CRAKREVENUE_API_KEY) is not set in GitHub Actions secrets."
            echo "Cloudflare Pages dashboard variables are not available to this workflow."
            echo "Add repository secrets: Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${CRAK_TOKEN}" ] && [ -z "${CRAKREVENUE_API_TOKEN}" ] && [ -z "${CRACKREVENUE_TOKEN}" ]; then
            echo "::error::CRAK_TOKEN (or CRAKREVENUE_API_TOKEN / CRACKREVENUE_TOKEN) is not set in GitHub Actions secrets."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Actions secrets."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/cloudflare-pages-crak-build.md"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync CRAK to Cloudflare Pages runtime (Production + Preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b1a465896521acc54d57f28ce75cc717
        run: node scripts/sync-pages-preview-crak-env.mjs

      - name: Build Next.js application for Cloudflare Pages
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # MatureCamRooms account (public id). Pages wrangler.toml must not set account_id.
          accountId: b1a465896521acc54d57f28ce75cc717
          command: pages deploy .vercel/output/static --project-name=maturecamrooms --branch=${{ github.ref_name }}

      - name: Verify model profile URLs (preview or production)
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PAGES_PREVIEW_URL: ${{ github.ref == 'refs/heads/main' && 'https://maturecamrooms.com' || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Waiting 30s for branch preview propagation…"
            sleep 30
          fi
          node scripts/verify-preview-model-urls.mjs

      - name: Verify production CRAK health
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://maturecamrooms.com/api/crak/health" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('configured') else 1)"; then
              echo "Production CRAK health OK (configured=true)"
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; waiting 15s…"
            sleep 15
          done
          echo "::error::Production CRAK health check failed after deploy"
          exit 1
