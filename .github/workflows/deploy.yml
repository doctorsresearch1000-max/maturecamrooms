name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application for Cloudflare Pages
        env:
          CRAK_API_KEY: ${{ secrets.CRAK_API_KEY }}
          CRAK_TOKEN: ${{ secrets.CRAK_TOKEN }}
          CRAK_CAM_API_BASE: ${{ secrets.CRAK_CAM_API_BASE }}
          CRAK_BRANDS: ${{ secrets.CRAK_BRANDS }}
          CRAK_LANDING_ID: ${{ secrets.CRAK_LANDING_ID }}
          CRAKREVENUE_API_KEY: ${{ secrets.CRAKREVENUE_API_KEY }}
          CRAKREVENUE_API_TOKEN: ${{ secrets.CRAKREVENUE_API_TOKEN }}
          CRACKREVENUE_TOKEN: ${{ secrets.CRACKREVENUE_TOKEN }}
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=maturecamrooms
